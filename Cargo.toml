[package]
name = "isponsorblocktv"
version = "0.1.0"
edition = "2024"
description = "SponsorBlock client for YouTube TV apps (Rust port of iSponsorBlockTV)"
license = "GPL-3.0-only"
repository = "https://github.com/lparry-ai/iSponsorBlockTV"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
futures-util = "0.3.34"
hex = "0.4.3"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "form", "http2", "rustls-no-provider", "query"] }
roxmltree = "0.21.1"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
